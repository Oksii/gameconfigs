/// BINDS

unbindall
bind TAB "+scores"
bind ESCAPE "togglemenu"
bind SPACE "+moveup"
bind 1 "weaponbank 1;cg_drawgun 1"
bind 2 "weaponbank 2;cg_drawgun 0"
bind 3 "weaponbank 3;cg_drawgun 0"
bind 4 "weaponbank 4;cg_drawgun 1"
bind 5 "weaponbank 6;cg_drawgun 1"
bind 7 "weaponbank 7;cg_drawgun 1"
bind b "+dropweapon"
bind c "+movedown"
bind e "+leanright"
bind f "+activate"
bind  "+zoom"
bind h "weapalt"
bind i "vsay LetsGo;"
bind j "say ^6:D"
bind k "vsay PathCleared"
bind l "openlimbomenu"
bind m "minimize"
bind o "unpause"
bind p "pause"
bind r "+reload"
bind q "+leanleft"
bind v "mp_quickmessage"
bind y "messagemode2"
bind t "messagemode"
bind ~ "toggleconsole"
bind . "set name "^3im^5mo^6o{"  
bind , "set name "^7immoo^e{"
bind F1 "vote yes"
bind F2 "vote no"
bind F3 "ready;setspawnpt 0; set r_uifullscreen 1; play sound/misc/menu2.wav"
bind F4 "notready; play sound/misc/menu2.wav"
bind F5 "scores"
bind F6 "screenshotjpeg; echo ^>( ^7Written JPEG Screenshot ^>); play sound/misc/menu2.wav"
bind F7 "in_restart"
bind F8 "team s; echo ^7Joining Spectator; play sound/misc/menu2.wav"
bind F9 "team r 1 3 38; echo ^7Joining ^1Axis Team; play sound/misc/menu2.wav"
bind F10 "team b 1 8 37; echo ^7Joining ^4Allies Team; play sound/misc/menu2.wav"
bind CAPSLOCK "+speed"
bind SHIFT "+sprint"
bind ALT "+wstats"
bind CTRL "+wtopshots"

// mouse binds //

bind MWHEELUP "+zoom;+attack;-attack;-zoom"
bind MOUSE1 "+attack"
bind MOUSE2 "weaponbank 5;cg_drawgun 1;com_maxfps 250"
bind MOUSE3 "kill;forcetapout"
bind MOUSE4 "set cg_fov 90; sensitivity 0.32; seta cg_crosshairSize 27; seta cg_drawCrosshair "5"; cg_drawgun 0; cg_crosshaircolor cyan; echo ^7fov ^190"
bind MOUSE5 "set cg_fov 115; sensitivity 0.88; seta cg_crosshairSize 32; seta cg_drawCrosshair "5"; cg_drawgun 0; cg_crosshaircolor yellow; echo ^7fov ^2115"

// movement //

bind w "+forward"
bind a "+moveleft"
bind s "+back"
bind d "+moveright"

// classes binds //

bind End  "mp_playertype 2; mp_weapon 4; echo ^7Spawning ^1Engineer; 	play sound/multiplayer/allies/a-engineer"
bind Del  "mp_playertype 1; mp_weapon 3; echo ^7Spawning ^3Medic; 	play sound/multiplayer/allies/a-medic"
bind PgDn "mp_playertype 3; mp_weapon 3; echo ^7Spawning ^dLieutenant;  play sound/multiplayer/allies/a-lt"
bind Home "mp_playertype 0; mp_weapon 8; echo ^7Spawning ^2Panzer; 	play sound/multiplayer/allies/a-soldier"
bind PgUp "mp_playertype 0; mp_weapon 6; echo ^7Spawning ^6Sniper; 	play sound/multiplayer/allies/a-soldier"

// spawnpoints binds //

bind UPARROW 	"setspawnpt 101; 	echo ^>Sniperhill spawn (spawnpt ^>101^7)	;play sound/movers/switches/switch"
bind DOWNARROW 	"setspawnpt 0; 		echo ^0Default spawn (spawnpt ^00^7)		;play sound/movers/switches/switch"
bind LEFTARROW 	"setspawnpt 1; 		echo ^1Axis spawn side (spawnpt ^11^7)		;play sound/movers/switches/switch"
bind RIGHTARROW "setspawnpt 2; 		echo ^4Allies spawn (spawnpt ^42^7)		;play sound/movers/switches/switch"
bind KP_INS	"setspawnpt 5; 		echo ^5Barracks spawn (spawnpt ^55^7)		;play sound/movers/switches/switch"

// spawntimer script //

bind x "play sound/misc/menu2;vstr timer_allies"

// r_uifullscreen //

bind F11 "r_uifullscreen 1;echo ^7R_UIFullScreen ^01"
bind F12 "r_uifullscreen 0;echo ^7R_UIFullScreen ^10"

// volume script //

bind "=" "vstr volup"
bind "-" "vstr voldown"
set vol00 "set s_volume 0.0;set voldown vstr vol00;set volup vstr vol01;echo Volume ^2O^7=========="
set vol01 "set s_volume 0.1;set voldown vstr vol00;set volup vstr vol02;echo Volume =^2O^7========="
set vol02 "set s_volume 0.2;set voldown vstr vol01;set volup vstr vol03;echo Volume ==^2O^7========"
set vol03 "set s_volume 0.3;set voldown vstr vol02;set volup vstr vol04;echo Volume ===^2O^7======="
set vol04 "set s_volume 0.4;set voldown vstr vol03;set volup vstr vol05;echo Volume ====^3O^7======"
set vol05 "set s_volume 0.5;set voldown vstr vol04;set volup vstr vol06;echo Volume =====^3O^7====="
set vol06 "set s_volume 0.6;set voldown vstr vol05;set volup vstr vol07;echo Volume ======^3O^7===="
set vol07 "set s_volume 0.7;set voldown vstr vol06;set volup vstr vol08;echo Volume =======^1O^7==="
set vol08 "set s_volume 0.8;set voldown vstr vol07;set volup vstr vol09;echo Volume ========^1O^7=="
set vol09 "set s_volume 0.9;set voldown vstr vol08;set volup vstr vol10;echo Volume =========^1O^7="
set vol10 "set s_volume 1.0;set voldown vstr vol09;set volup vstr vol10;echo Volume ==========^1O^7"
set volup vstr vol05
set voldown vstr vol05

